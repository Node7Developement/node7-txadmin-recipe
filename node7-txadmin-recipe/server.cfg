# NODE7 LABS RedM Server Configuration
# https://docs.fivem.net/docs/server-manual/server-commands/




## Server information

sv_hostname "⚜️ NODE7 LABS | 🤠 New Realistic County | 🧩 Custom Framework in Development | 🎭 Serious Roleplay | 🛠️ Developers & Staff Wanted"

sets Discord "💬 NODE7 Community | 🤝 Join the County | 📢 Updates, Support & Applications | 🔗 https://discord.gg/j2H3kjEpgf"


sets GitHub "💻 NODE7 Development | 🧩 Framework Resources, Scripts & Updates | 🔗 https://github.com/Node7Developement"


sets sv_projectName "⚜️ NODE7 LABS | 🤠 New Realistic County | 🎭 Serious Roleplay | 🛠️ Developers Wanted | 🛡️ Staff Applications Open"


sets sv_projectDesc "⚜️ NODE7 LABS | 🤠 A New Realistic RedM County | 🧩 Custom Framework | 🎭 Serious Roleplay | 🚂 Immersive Wild West Experience"


sets tags "redm, roleplay, seriousrp, realistic, customframework, node7, economy, jobs, trains, robberies, western, immersive, english, canada"


sets locale "en-CA"


## RedM settings
set gamename rdr3
sv_enforceGameBuild 1491
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on

{{serverEndpoints}}
{{addPrincipalsMaster}}

set steam_webApiKey "none"
set resources_useSystemChat true
sv_scriptHookAllowed 0


## NODE7 settings
set node7_serverName "NODE7 LABS"
set node7_environment "development"

## Database Connection String
set mysql_connection_string "{{dbConnectionString}}"
## NODE7 LABS Server Logo
# Add node7-logo.png beside server.cfg, then uncomment:
# load_server_icon "node7-logo.png"

## Ability loadout
setr node7_disable_ability_loadout 1

# ==============================================================================
# DEFAULT REDM RESOURCES
# ==============================================================================
ensure mapmanager
ensure spawnmanager
ensure sessionmanager-rdr3
ensure redm-map-one
ensure hardcap
ensure baseevents
ensure rconlog

# ==============================================================================
# NODE7 PERMISSIONS
# ==============================================================================
exec permissions.cfg

# ==============================================================================
# NODE7 STARTUP ORDER
# Do not replace this with broad folder ensures; dependency order matters.
# ==============================================================================

# Database, branding and shared libraries
ensure oxmysql
ensure node7-console-brand
ensure ox_lib
ensure progressbar

# Core and shared interaction systems
ensure node7-core
ensure ox_target
ensure node7-connect
ensure node7-input
ensure node7-menu-base
ensure node7-interaction

# Inventory, economy, weapons and owned assets
ensure node7-inventory
ensure node7-cashitem
ensure node7-banking
ensure node7-bankdoors
ensure node7-weapons
ensure node7-ammo
ensure node7-horses

# Character, appearance and clothing stack
ensure node7-skins
ensure node7-appearance
ensure node7-wardrobe
ensure node7-clothing
ensure node7-barbershop
ensure node7-charselect

# Player UI and navigation
ensure node7-drawtext
ensure node7-timehud
ensure node7-hud
ensure node7-playerlist
ensure node7-mail
ensure node7-directory
ensure node7-jobcenter
ensure node7-pausemenu
ensure node7-radialmenu

# Shops, consumables and ambient systems
ensure node7-consumeables
ensure node7-shop-catalogue
ensure node7-gun-catalogue
ensure node7-admincoords
ensure node7-density
ensure node7-npc-nospeak

# Minigames, doors, law and dispatch
ensure node7-lockpick-minigame
ensure node7-handcuff-minigame
ensure ox_doorlock
ensure node7-handcuffs
ensure node7-skills
ensure node7-dispatch
ensure node7-lawmen

# Activities and trains
ensure node7-robbing
ensure node7-ambienttrains
ensure node7-trains

# ==============================================================================
# NODE7 ACE HIERARCHY
# Staff -> Moderator -> Admin -> Owner
# ==============================================================================
add_principal group.node7_owner group.node7_admin
add_principal group.node7_admin group.node7_moderator
add_principal group.node7_moderator group.node7_staff
add_principal group.node7_admin group.admin

add_ace group.node7_staff node7.staff allow
add_ace group.node7_moderator node7.moderator allow
add_ace group.node7_moderator node7.mod allow
add_ace group.node7_admin node7 allow
add_ace group.node7_admin node7.admin allow
add_ace group.node7_admin node7admin.join allow
add_ace group.node7_owner node7.owner allow
add_ace group.node7_owner node7.god allow

# txAdmin-created administrators use group.admin.
add_ace group.admin node7 allow
add_ace group.admin node7.admin allow

# Protect server shutdown while allowing NODE7 administrators to use commands.
add_ace group.node7_admin command.quit deny
add_ace group.node7_admin command allow

# Core permission-management commands.
add_ace resource.node7-core command.add_principal allow
add_ace resource.node7-core command.remove_principal allow

# NODE7 command permissions
add_ace group.node7_admin command.traincleanup allow
add_ace group.node7_admin command.bankaccountcreate allow
add_ace group.node7_admin command.bankaccountset allow
add_ace group.node7_admin command.bankaccountadd allow
add_ace group.node7_admin command.bankaccountremove allow
add_ace group.node7_admin command.bankaccountfreeze allow

# NODE7 feature permissions
add_ace group.node7_admin node7.banking.admin allow
add_ace group.node7_admin node7.admincoords.use allow
add_ace group.node7_owner node7.admincoords.use allow
add_ace group.node7_admin node7.radialmenu.test allow
add_ace group.node7_owner node7.radialmenu.test allow
add_ace group.node7_owner node7.adminmenu allow
add_ace group.node7_admin node7.playerlist.staff allow

# Standard txAdmin/CFX administrators
add_ace group.admin command.traincleanup allow
add_ace group.admin node7.density.admin allow
add_ace group.admin node7.input.admin allow
add_ace group.admin node7.input.test allow
add_ace group.admin node7.menu.admin allow
add_ace group.admin node7.menu.test allow
add_ace group.admin node7.interaction.test allow
add_ace group.admin node7.interaction.admin allow
add_ace group.admin node7.zonenotify.test allow
add_ace group.admin node7.guncatalogue.test allow
add_ace group.admin node7.drawtext.test allow
add_ace group.admin node7.playerlist.staff allow
add_ace group.admin node7.mail.admin allow

# Optional remote mailbox access:
# add_ace group.admin node7.mail.remote allow

# ==============================================================================
# NODE7 OWNER IDENTIFIERS
# ==============================================================================
add_principal identifier.fivem:19380766 group.node7_owner
add_principal identifier.discord:1019014170458456074 group.node7_owner
