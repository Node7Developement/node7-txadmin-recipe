$engine: 3
$onesync: on

name: NODE7 RedM Server
version: 1.1.0
author: NODE7 Development Studios
description: Complete NODE7 RedM framework recipe with configuration, database, dependencies, and all public NODE7 resources.

tasks:
  # Download this recipe repository. The GitHub repository must be flat.
  - action: download_github
    src: https://github.com/Node7Developement/node7-txadmin-recipe
    ref: main
    dest: ./tmp/NODE7

  - action: move_path
    src: ./tmp/NODE7/server.cfg
    dest: ./server.cfg
    overwrite: true

  - action: move_path
    src: ./tmp/NODE7/permissions.cfg
    dest: ./permissions.cfg
    overwrite: true

  # Database selected in txAdmin.
  - action: connect_database

  - action: query_database
    file: ./tmp/NODE7/database/node7_core.sql

  # Official CFX RedM resources.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: remove_path
    path: ./resources/[cfx-default]/[gameplay]/chat

  # Built oxmysql release.
  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip

  - action: unzip
    src: ./tmp/files/oxmysql.zip
    dest: ./resources/[standalone]

  # NODE7 dependencies and resources.
  - action: download_github
    src: https://github.com/Node7Developement/node7-console-brand
    ref: main
    subpath: node7-console-brand
    dest: ./resources/[node7]/node7-console-brand

  - action: download_github
    src: https://github.com/Node7Developement/ox_lib
    ref: main
    subpath: ox_lib
    dest: ./resources/[standalone]/ox_lib

